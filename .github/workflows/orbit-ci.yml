name: Orbit acceptance
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: orbit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24.18.0'}
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:coolify-compose
      - run: pnpm local:setup
      # Load the isolated local config before module evaluation, not after imports.
      - run: |
          ORBIT_CONFIG_FILE=.runtime/local.env node --env-file=.runtime/local.env --import tsx scripts/openapi.ts
          pnpm exec openapi-typescript packages/schemas/openapi.json -o packages/api-client/src/generated.ts
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:migration-profile
      - run: python3 scripts/check-secrets.py && node scripts/dependency-inventory.mjs
      - run: pnpm audit --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance
        # Invitations need the administration feature, as in production.
        env:
          ORBIT_ADMINISTRATION: 'true'
          # Account pages and the settings center (ADR 0013, ADR 0027), so their browser specs run.
          ORBIT_ACCOUNT: 'true'
          ORBIT_SETTINGS_CENTER: 'preview'
        run: |
          pnpm exec tsx scripts/seed-e2e.ts
          pnpm dev > .runtime/ci-services.log 2>&1 &
          for i in $(seq 1 60); do curl --fail --silent http://localhost:4310/ > /dev/null && break; sleep 1; done
          pnpm test:e2e
      - name: Preserve non-secret acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orbit-acceptance
          path: |
            docs/evidence/
            .runtime/playwright-results/**/*.png
          retention-days: 14
  # The browser suite with the settings center on (phase 5, ruling P5-R5):
  # every old settings address leads to the center, so every spec must pass
  # or skip there too. Its own job on fresh services, beside the job above;
  # the same setup and flags, ORBIT_SETTINGS_CENTER=on.
  browser-settings-center-on:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24.18.0'}
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm local:setup
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the stack with the settings center on
        # Invitations need the administration feature, as in production.
        # Processes started in the background keep running into the next
        # steps; the runner ends them when the job ends.
        env:
          ORBIT_ADMINISTRATION: 'true'
          # Account pages and the settings center (ADR 0013, ADR 0027), so their browser specs run.
          ORBIT_ACCOUNT: 'true'
          ORBIT_SETTINGS_CENTER: 'on'
        run: |
          pnpm exec tsx scripts/seed-e2e.ts
          pnpm dev > .runtime/ci-services.log 2>&1 &
          for i in $(seq 1 60); do curl --fail --silent http://localhost:4310/ > /dev/null && break; sleep 1; done
      - name: Check that the stack serves the settings center stage on
        # Fails unless the running stack reports the stage this job is for,
        # so the suite never passes against another stage.
        run: node scripts/e2e-stage-check.mjs on
      - name: Browser acceptance with the settings center on
        run: pnpm test:e2e
      - name: Preserve non-secret acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orbit-acceptance-settings-center-on
          path: |
            docs/evidence/
            .runtime/playwright-results/**/*.png
          retention-days: 14
