# Local proof of concept stack. Secrets come from .work/env, generated by run.sh.
name: orbit-webmail-poc

x-roundcube: &roundcube
  build:
    context: ..
    dockerfile: Dockerfile
  image: orbit-webmail-poc-roundcube:local
  # The hardening of the production service, so the suite proves that configuration.
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  environment:
    ROUNDCUBEMAIL_DB_HOST: webmail-db
    ROUNDCUBEMAIL_DB_PORT: "5432"
    ROUNDCUBEMAIL_DB_USER: roundcube
    ROUNDCUBEMAIL_DB_PASSWORD: ${POC_DB_PASSWORD:?run run.sh}
    ROUNDCUBEMAIL_DB_NAME: roundcubemail
    ROUNDCUBEMAIL_DES_KEY: ${POC_DES_KEY:?run run.sh}
    ORBIT_WEBMAIL_BRIDGE_URL: http://bridge:8080
    ORBIT_WEBMAIL_BRIDGE_SECRET: ${POC_BRIDGE_SECRET:?run run.sh}
    ORBIT_WEBMAIL_PARENT_ORIGIN: https://${POC_APEX:-orbit.test}
    ORBIT_WEBMAIL_TLS_CA_FILE: /poc-ca/ca.crt
  volumes:
    - ./.work/certs/ca.crt:/poc-ca/ca.crt:ro
    - ./tools:/poc-tools:ro
  depends_on:
    webmail-db:
      condition: service_healthy
    bridge:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8000);exit($$s?0:1);"]
    interval: 3s
    timeout: 3s
    retries: 40

services:
  roundcube:
    <<: *roundcube
    networks:
      - webmail
      - proxy
      - webmail-egress

  # The same container with no route out of the internal webmail network (G4).
  roundcube-isolated:
    <<: *roundcube
    profiles: ["isolated"]
    networks:
      - webmail

  webmail-db:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    environment:
      POSTGRES_USER: roundcube
      POSTGRES_PASSWORD: ${POC_DB_PASSWORD:?run run.sh}
      POSTGRES_DB: roundcubemail
    volumes:
      - webmail-db-data:/var/lib/postgresql/data
    networks:
      - webmail
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundcube -d roundcubemail"]
      interval: 2s
      timeout: 3s
      retries: 30

  bridge:
    image: node:24-alpine@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
    command: ["node", "/app/server.mjs"]
    environment:
      POC_BRIDGE_SECRET: ${POC_BRIDGE_SECRET:?run run.sh}
      POC_CONTROL_SECRET: ${POC_CONTROL_SECRET:?run run.sh}
      POC_PARENT_ORIGIN: https://${POC_APEX:-orbit.test}
      POC_MAIL_HOST: mail.test
      POC_ALICE_PASSWORD: ${POC_ALICE_PASSWORD:?run run.sh}
      POC_BOB_PASSWORD: ${POC_BOB_PASSWORD:?run run.sh}
      POC_CAROL_PASSWORD: ${POC_CAROL_PASSWORD:?run run.sh}
    volumes:
      - ./mock-bridge:/app:ro
    # Only so the mock resolves an address Roundcube can reach; the real bridge
    # returns a public address and is not on webmail-egress.
    networks:
      webmail: {}
      webmail-egress: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    image: greenmail/standalone:2.1.8@sha256:d556b8c7df01ba04a0e0f67dacab2c5f75a61207a51774e0654c179b83a671e1
    environment:
      # One line: the framework check reads a line that starts with "-D" as a list item.
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.tls.keystore.file=/certs/mail.p12 -Dgreenmail.tls.keystore.password=changeit -Dgreenmail.users=alice:${POC_ALICE_PASSWORD:?run run.sh}@mail.test,bob:${POC_BOB_PASSWORD:?run run.sh}@mail.test -Dgreenmail.users.login=email -Dgreenmail.verbose"
    entrypoint: ["bash", "-c", "/home/greenmail/run_greenmail.sh 2>&1 | tee /logs/greenmail.log"]
    volumes:
      - ./.work/certs/mail.p12:/certs/mail.p12:ro
      - ./.work/results:/logs
    networks:
      webmail-egress:
        aliases:
          - mail.test
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/3143"]
      interval: 2s
      timeout: 3s
      retries: 40

  # Real Dovecot and Postfix for STARTTLS, which GreenMail does not offer (G10).
  # Dovecot refuses plaintext login and Postfix offers AUTH only after STARTTLS.
  mail-starttls:
    image: mailserver/docker-mailserver:15.1.0@sha256:af51b15dd3fc72153c0e90eb7692bb5e3a463212d87959a80fa7aa89b617d44a
    hostname: mail-starttls.test
    environment:
      SSL_TYPE: manual
      SSL_CERT_PATH: /certs/mail-starttls.crt
      SSL_KEY_PATH: /certs/mail-starttls.key
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: "0"
      ENABLE_RSPAMD: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_AMAVIS: "0"
      ENABLE_FAIL2BAN: "0"
      ENABLE_POSTGREY: "0"
      ENABLE_OPENDKIM: "0"
      ENABLE_OPENDMARC: "0"
      ENABLE_POLICYD_SPF: "0"
      ENABLE_UPDATE_CHECK: "0"
    volumes:
      - ./.work/certs:/certs:ro
      - ./.work/mail-starttls:/tmp/docker-mailserver
    networks:
      webmail-egress:
        aliases:
          - mail-starttls.test
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/143 && cat < /dev/null > /dev/tcp/127.0.0.1/587"]
      interval: 3s
      timeout: 3s
      retries: 40

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      POC_APEX: ${POC_APEX:-orbit.test}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./parent:/srv/parent:ro
      - ./.work/certs/site.crt:/certs/site.crt:ro
      - ./.work/certs/site.key:/certs/site.key:ro
    networks:
      proxy:
        aliases:
          - ${POC_APEX:-orbit.test}
          - webmail.${POC_APEX:-orbit.test}
          - evil.${POC_APEX:-orbit.test}
          - tracker.${POC_APEX:-orbit.test}
    depends_on:
      roundcube:
        condition: service_healthy

  # Stands in for the Orbit api service on its "frontend" network (G7).
  frontend-canary:
    image: node:24-alpine@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
    command: ["node", "-e", "require('http').createServer((q,s)=>s.end('canary')).listen(4311)"]
    networks:
      - frontend

  # Stands in for the services on the shared "egress" network: API, MCP, worker (G7).
  egress-canary:
    image: node:24-alpine@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
    command: ["node", "-e", "require('http').createServer((q,s)=>s.end('canary')).listen(4311)"]
    networks:
      - egress

  # Compose semantics for the rollback switch (G7).
  replica-probe:
    image: node:24-alpine@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
    command: ["sleep", "3600"]
    deploy:
      replicas: ${ORBIT_WEBMAIL_REPLICAS:-0}
    networks:
      - webmail

  tests:
    profiles: ["tests"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    working_dir: /tests
    environment:
      POC_APEX: ${POC_APEX:-orbit.test}
      POC_CONTROL_SECRET: ${POC_CONTROL_SECRET:?run run.sh}
      POC_ALICE_PASSWORD: ${POC_ALICE_PASSWORD:?run run.sh}
      POC_BOB_PASSWORD: ${POC_BOB_PASSWORD:?run run.sh}
      POC_CAROL_PASSWORD: ${POC_CAROL_PASSWORD:?run run.sh}
    volumes:
      - ./tests:/tests
      - ./.work/certs/ca.crt:/poc-ca/ca.crt:ro
      - ./.work/results:/results
      - tests-node-modules:/tests/node_modules
    networks:
      - proxy
      - webmail
      - webmail-egress

networks:
  webmail:
    internal: true
  proxy: {}
  egress: {}
  webmail-egress: {}
  frontend: {}

volumes:
  webmail-db-data: {}
  tests-node-modules: {}
