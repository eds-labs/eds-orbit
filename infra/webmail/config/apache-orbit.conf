# Response hardening for every path Apache serves, including static assets and error pages.
# ORBIT_WEBMAIL_PARENT_ORIGIN must be set in the container environment. If it is missing,
# frame-ancestors holds the literal placeholder and browsers refuse to embed the page.
# frame-ancestors checks the whole chain, so 'self' is required for Roundcube's own
# preview and watermark frames. The top of the chain must still be the Orbit origin.
# Roundcube needs 'unsafe-inline' (inline handlers and bootstrap scripts) and 'unsafe-eval'
# (app.js evaluates the "exec" field of every AJAX response).
ServerTokens Prod
ServerSignature Off

Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' ${ORBIT_WEBMAIL_PARENT_ORIGIN}"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set Strict-Transport-Security "max-age=31536000"
