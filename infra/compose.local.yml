name: eds-orbit-local
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: orbit_migrator
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: orbit
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["orbit_pg:/var/lib/postgresql/data"]
    cpus: 2
    mem_limit: 1536m
    pids_limit: 180
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit_migrator -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["orbit_redis:/data"]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 60
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
volumes:
  orbit_pg:
  orbit_redis:
