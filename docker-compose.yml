name: eds-orbit

x-runtime: &runtime
  image: eds-orbit:${ORBIT_IMAGE_TAG:-0.1.0-rc.1}
  build:
    context: .
    dockerfile: infra/Dockerfile
    target: runner
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://orbit_app:${SERVICE_PASSWORD_64_DBAPP}@postgres:5432/${POSTGRES_DB:-orbit}}
  AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://orbit_auth:${SERVICE_PASSWORD_64_DBAUTH}@postgres:5432/${POSTGRES_DB:-orbit}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  AUTH_SECRET: ${AUTH_SECRET:-${SERVICE_REALBASE64_64_AUTHSECRET}}
  CREDENTIAL_KEY: ${CREDENTIAL_KEY:-${SERVICE_HEX_64_CREDENTIALKEY}}
  ORBIT_SETUP_TOKEN: ${ORBIT_SETUP_TOKEN:-${SERVICE_PASSWORD_64_ORBITSETUPTOKEN}}
  APP_ORIGIN: ${APP_ORIGIN:-${SERVICE_URL_WEB}}
  BIND_HOST: 0.0.0.0
  PORT: "4311"
  EXECUTION_MODE: ${EXECUTION_MODE:-test}
  ENABLE_EXTERNAL_WRITES: ${ENABLE_EXTERNAL_WRITES:-false}
  ENABLE_POSTIZ_DRAFTS: ${ENABLE_POSTIZ_DRAFTS:-false}
  LIVE_RAG_EVAL_PASSED: ${LIVE_RAG_EVAL_PASSED:-false}
  ORBIT_CONTENT_PACKAGES: ${ORBIT_CONTENT_PACKAGES:-false}
  ORBIT_TOOL_SEARCH: ${ORBIT_TOOL_SEARCH:-false}
  ORBIT_AGENTS: ${ORBIT_AGENTS:-false}
  ORBIT_IMAGE_REFERENCES: ${ORBIT_IMAGE_REFERENCES:-false}
  ORBIT_AGENT_REVIEW_AUTHORITY: ${ORBIT_AGENT_REVIEW_AUTHORITY:-false}
  ORBIT_MODULES: ${ORBIT_MODULES:-false}
  ORBIT_MCP_OAUTH: ${ORBIT_MCP_OAUTH:-false}
  ORBIT_MCP_DCR: ${ORBIT_MCP_DCR:-false}
  MCP_RESOURCE: ${MCP_RESOURCE:-}
  ORBIT_MCP_CIMD_HOSTS: ${ORBIT_MCP_CIMD_HOSTS:-chatgpt.com}
  ORBIT_MCP_GATEWAY: ${ORBIT_MCP_GATEWAY:-false}
  MCP_PORT: ${MCP_PORT:-4312}
  # Empty = ${APP_ORIGIN}/api/auth/jwks; the mcp service sets the internal URL.
  MCP_JWKS_URL: ${MCP_JWKS_URL:-}
  ORBIT_MCP_ALLOWED_ORIGINS: ${ORBIT_MCP_ALLOWED_ORIGINS:-}
  ORBIT_MCP_TASKS: ${ORBIT_MCP_TASKS:-false}
  ORBIT_MCP_PROPOSALS: ${ORBIT_MCP_PROPOSALS:-false}
  ORBIT_MODULE_ROLES: ${ORBIT_MODULE_ROLES:-false}
  ORBIT_PUBLIC_INGRESS: ${ORBIT_PUBLIC_INGRESS:-false}
  # Support module (WP5.1): off until the pilot is approved.
  ORBIT_SUPPORT: ${ORBIT_SUPPORT:-false}
  # Platform files (WP4.6): an own R2 bucket and token, never the backup ones.
  ORBIT_FILES: ${ORBIT_FILES:-false}
  # Encrypted rows in Postgres (in the database backup) or "s3" for a bucket.
  FILES_BACKEND: ${FILES_BACKEND:-database}
  # E-mail over the project's mailbox and member notifications (WP4.7).
  ORBIT_EMAIL: ${ORBIT_EMAIL:-false}
  ORBIT_NOTIFICATIONS: ${ORBIT_NOTIFICATIONS:-false}
  # Real-time fan-out over Redis for the chat SSE route (WP4.3 Part B).
  ORBIT_REALTIME: ${ORBIT_REALTIME:-false}
  FILES_S3_ENDPOINT: ${FILES_S3_ENDPOINT:-}
  FILES_S3_BUCKET: ${FILES_S3_BUCKET:-}
  FILES_S3_REGION: ${FILES_S3_REGION:-auto}
  FILES_S3_ACCESS_KEY_ID: ${FILES_S3_ACCESS_KEY_ID:-}
  FILES_S3_SECRET_ACCESS_KEY: ${FILES_S3_SECRET_ACCESS_KEY:-}
  # Generated and kept by Coolify like CREDENTIAL_KEY; losing it makes files unreadable.
  FILES_ENCRYPTION_KEY: ${FILES_ENCRYPTION_KEY:-${SERVICE_HEX_64_FILESKEY}}
  FILES_MAX_BYTES: ${FILES_MAX_BYTES:-20971520}
  # All files of one project; see packages/config (backup work space).
  FILES_PROJECT_QUOTA_BYTES: ${FILES_PROJECT_QUOTA_BYTES:-104857600}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_VERIFIED_MODELS: ${OPENAI_VERIFIED_MODELS:-}
  OPENAI_RATE_CARD_JSON: ${OPENAI_RATE_CARD_JSON:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-}
  GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
  GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
  PUBLISHER_INSTANCE_ID: ${PUBLISHER_INSTANCE_ID:-${SERVICE_BASE64_32_PUBLISHERINSTANCE}}
  QUEUE_NAMESPACE: ${QUEUE_NAMESPACE:-orbit}

services:
  migrate:
    <<: *runtime
    restart: "no"
    command: ["node_modules/.bin/tsx", "scripts/db-deploy.ts", "--allow-remote-migration"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://orbit_migrator:${SERVICE_PASSWORD_64_DBMIGRATOR}@postgres:5432/${POSTGRES_DB:-orbit}}
      DATABASE_URL: ${DATABASE_URL:-postgresql://orbit_app:${SERVICE_PASSWORD_64_DBAPP}@postgres:5432/${POSTGRES_DB:-orbit}}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://orbit_auth:${SERVICE_PASSWORD_64_DBAUTH}@postgres:5432/${POSTGRES_DB:-orbit}}
      ORBIT_RELEASE_APPROVAL: ${ORBIT_RELEASE_APPROVAL:?}
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    labels:
      coolify.exclude_from_hc: "true"

  api:
    <<: *runtime
    environment: *api-environment
    expose:
      - "4311"
    networks:
      - frontend
      - database
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4311/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *runtime
    command: ["node_modules/.bin/tsx", "apps/worker/src/main.ts"]
    environment: *api-environment
    networks:
      - database
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');try{const h=JSON.parse(fs.readFileSync('/tmp/orbit-worker-health.json','utf8'));process.exit(Number.isFinite(h.checkedAt)&&Date.now()-h.checkedAt>=0&&Date.now()-h.checkedAt<30000?0:1)}catch{process.exit(1)}"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  # MCP gateway (Track M, WP-M5). Same image and environment as the API. While
  # ORBIT_MCP_GATEWAY or ORBIT_MCP_OAUTH is not "true" it only answers
  # /healthz ({"status":"disabled"}) and starts no auth, database or tool work.
  # Coolify routes the public path /mcp of the app domain to this service.
  mcp:
    <<: *runtime
    command: ["node_modules/.bin/tsx", "apps/api/src/mcp-main.ts"]
    environment:
      <<: *api-environment
      # Fixed: expose, healthcheck and SERVICE_URL_MCP_4312 name this port.
      MCP_PORT: "4312"
      # Token verification stays on the internal network.
      MCP_JWKS_URL: ${MCP_JWKS_URL:-http://api:4311/api/auth/jwks}
      SERVICE_URL_MCP_4312: /mcp
    # Longer than the gateway's 10 s forced-exit timeout (shutdown.ts), so a
    # hung close still exits on its own before Docker sends SIGKILL.
    stop_grace_period: 15s
    expose:
      - "4312"
    networks:
      - frontend
      - database
      - egress
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4312/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    <<: *runtime
    command: ["apps/web/node_modules/.bin/next", "start", "apps/web", "-H", "0.0.0.0", "-p", "4310"]
    environment:
      ORBIT_API_ORIGIN: http://api:4311
      # Serves the MCP protected resource metadata paths under /.well-known.
      ORBIT_MCP_ORIGIN: ${ORBIT_MCP_ORIGIN:-http://mcp:4312}
      NEXT_TELEMETRY_DISABLED: "1"
      SERVICE_URL_WEB_4310: /
    expose:
      - "4310"
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000,mode=1770
      - /app/apps/web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit_migrator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${SERVICE_PASSWORD_64_DBMIGRATOR}}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
    volumes:
      - orbit_pg:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit_migrator -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backup:
    image: eds-orbit-backup:${ORBIT_IMAGE_TAG:-0.1.0-rc.1}
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    environment:
      PGHOST: postgres
      PGUSER: orbit_migrator
      PGPASSWORD: ${DB_PASSWORD:-${SERVICE_PASSWORD_64_DBMIGRATOR}}
      PGDATABASE: ${POSTGRES_DB:-orbit}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-external}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-orbit/}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    networks:
      - database
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/orbit-backup", "health"]
      interval: 5m
      timeout: 10s
      start_period: 30s
      retries: 1
    labels:
      coolify.exclude_from_hc: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - orbit_redis:/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  frontend:
    internal: true
  database:
    internal: true
  egress: {}

volumes:
  orbit_pg: {}
  orbit_redis: {}
