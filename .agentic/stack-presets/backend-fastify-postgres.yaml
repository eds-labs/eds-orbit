id: backend-fastify-postgres
label: 'Backend API: Fastify + Postgres'
description: "Vordefiniertes Preset für Backend API: Fastify + Postgres mit dokumentierten Einsatzgrenzen, Teststrategie und Betriebsanforderungen."
application_type: "backend-api"
recommended_tools:
- "TypeScript"
- "Node.js LTS"
- "Fastify"
- "Postgres"
- "Drizzle or Prisma"
- "Drizzle Kit or Prisma Migrate"
- "Vitest"
- "Supertest/light-my-request + test database"
deployment_hint: "Passendes Deployment-Preset auswählen, Zielumgebung validieren und Production-Änderungen nur nach Freigabe ausführen."
use_when:
- performante, schlanke HTTP API
- TypeScript-Team
- Plugin-Architektur gewünscht
- Microservice oder API für mehrere Clients
avoid_when:
- Team möchte batteries-included Architektur mit DI/Modulen out of the box
- viele Enterprise-Konventionen sollen durch Framework erzwungen werden
platforms:
- backend
runtime: Node.js LTS
language: TypeScript
framework: Fastify
database:
  engine: Postgres
  orm: Drizzle or Prisma
  migrations: Drizzle Kit or Prisma Migrate
api:
  style: REST
  validation: JSON Schema or Zod
  docs: OpenAPI
testing:
  unit: Vitest
  integration: Supertest/light-my-request + test database
structure_ref: .agentic/app-structures/backend-fastify.md
quality:
  required_checks:
  - lint
  - typecheck
  - test
  agentic_rules:
  - erst Plan, dann Umsetzung
  - bestehende Patterns respektieren
  - keine neue Dependency ohne Begründung
  - Tests für neue oder geänderte Logik
