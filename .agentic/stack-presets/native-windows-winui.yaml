id: native-windows-winui
label: 'Native Windows: WinUI 3 + Windows App SDK'
description: "Vordefiniertes Preset für Native Windows: WinUI 3 + Windows App SDK mit dokumentierten Einsatzgrenzen, Teststrategie und Betriebsanforderungen."
application_type: "native-app"
recommended_tools:
- "C# or C++"
- "WinUI 3 / Windows App SDK"
- ".NET test framework"
- "WinAppDriver/Appium where configured"
deployment_hint: "Passendes Deployment-Preset auswählen, Zielumgebung validieren und Production-Änderungen nur nach Freigabe ausführen."
use_when:
- Windows-only oder Windows-first
- native Windows 11 UX
- tiefe Windows-Integration
- C#/.NET oder C++ Team
avoid_when:
- Mac/Linux müssen gleichwertig aus gleicher Codebasis unterstützt werden
- Web-Stack soll maximal wiederverwendet werden
platforms:
- windows
language: C# or C++
framework: WinUI 3 / Windows App SDK
architecture: MVVM
backend: local SQLite/custom API/Supabase depending on app
testing:
  unit: .NET test framework
  ui: WinAppDriver/Appium where configured
structure_ref: .agentic/app-structures/native-windows-winui.md
quality:
  required_checks:
  - dotnet build
  - dotnet test
  agentic_rules:
  - erst Plan, dann Umsetzung
  - bestehende Patterns respektieren
  - keine neue Dependency ohne Begründung
  - Tests für neue oder geänderte Logik
