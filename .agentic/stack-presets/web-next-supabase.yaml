id: web-next-supabase
label: 'Web/SaaS MVP: Next.js + Supabase'
description: "Vordefiniertes Preset für Web/SaaS MVP: Next.js + Supabase mit dokumentierten Einsatzgrenzen, Teststrategie und Betriebsanforderungen."
application_type: "fullstack-web"
recommended_tools:
- "Next.js App Router"
- "TypeScript"
- "Tailwind CSS"
- "shadcn/ui"
- "React Hook Form"
- "Zod"
- "Server Components"
- "Server Actions"
- "TanStack Query when client caching is needed"
- "Postgres"
- "Supabase"
- "Supabase Auth"
deployment_hint: "Passendes Deployment-Preset auswählen, Zielumgebung validieren und Production-Änderungen nur nach Freigabe ausführen."
use_when:
- SaaS/MVP oder Dashboard
- Auth, Storage, Realtime oder einfache Serverless-Funktionen gewünscht
- kleines bis mittleres Team
- schneller Produktstart wichtiger als maximale Backend-Kontrolle
avoid_when:
- stark individualisierte Backend-Domäne mit komplexer Service-Orchestrierung
- strenge Enterprise-Infrastrukturvorgaben
- Backend muss vollständig cloud-/vendor-neutral sein
platforms:
- web
frontend:
  framework: Next.js App Router
  language: TypeScript
  ui:
  - Tailwind CSS
  - shadcn/ui
  forms:
  - React Hook Form
  - Zod
  server_state:
  - Server Components
  - Server Actions
  - TanStack Query when client caching is needed
backend:
  primary: Next.js route handlers/server actions
  managed: Supabase Edge Functions for webhooks/third-party integrations
database:
  engine: Postgres
  provider: Supabase
  auth: Supabase Auth
  storage: Supabase Storage
  realtime: Supabase Realtime
  orm: Drizzle or Prisma; choose one, do not mix
testing:
  unit: Vitest
  e2e: Playwright
  component: Testing Library
structure_ref: .agentic/app-structures/web-next-supabase.md
quality:
  required_checks:
  - lint
  - typecheck
  - test
  agentic_rules:
  - erst Plan, dann Umsetzung
  - bestehende Patterns respektieren
  - keine neue Dependency ohne Begründung
  - Tests für neue oder geänderte Logik
