id: multiplatform-dotnet-maui
label: '.NET Cross-platform: .NET MAUI'
description: "Vordefiniertes Preset für .NET Cross-platform: .NET MAUI mit dokumentierten Einsatzgrenzen, Teststrategie und Betriebsanforderungen."
application_type: "multiplatform-app"
recommended_tools:
- "C#"
- ".NET MAUI"
- "dotnet test"
- "platform-specific UI tests"
deployment_hint: "Passendes Deployment-Preset auswählen, Zielumgebung validieren und Production-Änderungen nur nach Freigabe ausführen."
use_when:
