- Linux Desktop ist wichtig
- Team ist primär Web/TypeScript
platforms:
- android
- ios
- macos
- windows
language: C#
framework: .NET MAUI
architecture: MVVM
backend: ASP.NET Core/custom API/Supabase
testing:
  unit: dotnet test
  ui: platform-specific UI tests
structure_ref: .agentic/app-structures/multiplatform-dotnet-maui.md
quality:
  required_checks:
  - dotnet build
  - dotnet test
  agentic_rules:
  - erst Plan, dann Umsetzung
  - bestehende Patterns respektieren
  - keine neue Dependency ohne Begründung
  - Tests für neue oder geänderte Logik
