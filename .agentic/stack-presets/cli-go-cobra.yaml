id: cli-go-cobra
label: 'CLI: Go + Cobra'
description: "Vordefiniertes Preset für CLI: Go + Cobra mit dokumentierten Einsatzgrenzen, Teststrategie und Betriebsanforderungen."
application_type: "cli-tool"
recommended_tools:
- "Go"
- "Cobra"
- "go test"
- "golden tests where useful"
deployment_hint: "Passendes Deployment-Preset auswählen, Zielumgebung validieren und Production-Änderungen nur nach Freigabe ausführen."
use_when:
- einfach verteilbare Single-Binary CLI
- DevOps-/Platform-Tooling
- Cross-platform Binary wichtig
- Go-Team
avoid_when:
- CLI ist vor allem ein dünner Wrapper um Python-Datenlogik
- Team kann kein Go
platforms:
- macos
- windows
- linux
language: Go
framework: Cobra
config: Viper optional
testing:
  unit: go test
  integration: golden tests where useful
structure_ref: .agentic/app-structures/cli-go-cobra.md
quality:
  required_checks:
  - go test ./...
  - go vet ./...
  - gofmt
  agentic_rules:
  - erst Plan, dann Umsetzung
  - bestehende Patterns respektieren
  - keine neue Dependency ohne Begründung
  - Tests für neue oder geänderte Logik
