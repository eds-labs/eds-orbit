id: cli-python-typer
label: 'CLI: Python + Typer'
description: "Vordefiniertes Preset für CLI: Python + Typer mit dokumentierten Einsatzgrenzen, Teststrategie und Betriebsanforderungen."
application_type: "cli-tool"
recommended_tools:
- "Python"
- "Typer"
- "pytest"
- "ruff"
- "uv + pyproject.toml"
deployment_hint: "Passendes Deployment-Preset auswählen, Zielumgebung validieren und Production-Änderungen nur nach Freigabe ausführen."
use_when:
- interne Automatisierung
- Daten-/AI-nahe CLI
- schnelle Entwicklung mit Python Type Hints
- Distribution über uv/pipx ausreichend
avoid_when:
- kleines statisches Binary ohne Python-Runtime ist Pflicht
- maximale Startzeit-Performance ist kritisch
platforms:
- macos
- windows
- linux
language: Python
framework: Typer
packaging: uv + pyproject.toml
testing:
  unit: pytest
  lint: ruff
structure_ref: .agentic/app-structures/cli-python-typer.md
quality:
  required_checks:
  - ruff check
  - pytest
  agentic_rules:
  - erst Plan, dann Umsetzung
  - bestehende Patterns respektieren
  - keine neue Dependency ohne Begründung
  - Tests für neue oder geänderte Logik
