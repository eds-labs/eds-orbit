id: multiplatform-kmp-compose
label: 'Cross-platform Kotlin: KMP + Compose Multiplatform'
description: "Vordefiniertes Preset für Cross-platform Kotlin: KMP + Compose Multiplatform mit dokumentierten Einsatzgrenzen, Teststrategie und Betriebsanforderungen."
application_type: "multiplatform-app"
recommended_tools:
- "Kotlin"
- "Kotlin Multiplatform + Compose Multiplatform"
- "Kotlin test"
- "native platform tests"
deployment_hint: "Passendes Deployment-Preset auswählen, Zielumgebung validieren und Production-Änderungen nur nach Freigabe ausführen."
use_when:
- Kotlin-Team
- Android stark im Fokus, iOS soll mitziehen
- Business-Logik soll zwischen iOS/Android/Desktop geteilt werden
- optional auch UI mit Compose Multiplatform teilen
avoid_when:
- Team ist nicht Kotlin-erfahren
- Web als primäre Plattform mit maximaler Browser-Integration
platforms:
- android
- ios
- desktop
- web beta/optional
language: Kotlin
framework: Kotlin Multiplatform + Compose Multiplatform
backend: Ktor/Spring/custom API
database_local: SQLDelight or platform-native persistence
testing:
  unit: Kotlin test
  platform: native platform tests
structure_ref: .agentic/app-structures/multiplatform-kmp.md
quality:
  required_checks:
  - gradle test
  - detekt/ktlint if configured
  agentic_rules:
  - erst Plan, dann Umsetzung
  - bestehende Patterns respektieren
  - keine neue Dependency ohne Begründung
  - Tests für neue oder geänderte Logik
