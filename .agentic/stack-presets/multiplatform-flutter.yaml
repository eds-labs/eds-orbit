id: multiplatform-flutter
label: 'Cross-platform UI: Flutter'
description: "Vordefiniertes Preset für Cross-platform UI: Flutter mit dokumentierten Einsatzgrenzen, Teststrategie und Betriebsanforderungen."
application_type: "multiplatform-app"
recommended_tools:
- "Dart"
- "Flutter"
- "flutter test"
- "integration_test"
deployment_hint: "Passendes Deployment-Preset auswählen, Zielumgebung validieren und Production-Änderungen nur nach Freigabe ausführen."
use_when:
- eine UI-Codebasis für iOS, Android, Web und Desktop gewünscht
- stark eigene UI/Brand Experience
- Team akzeptiert Dart
- konsistentes UI über Plattformen wichtiger als 100% native UI-Konvention
avoid_when:
- Team ist fest im React/TypeScript-Stack
- native Plattform-Konventionen sind wichtiger als gemeinsamer UI-Code
platforms:
- ios
- android
- web
- macos
- windows
- linux
language: Dart
framework: Flutter
backend: Supabase, Firebase, or custom API
state: Riverpod or Bloc
testing:
  unit: flutter test
  integration: integration_test
structure_ref: .agentic/app-structures/multiplatform-flutter.md
quality:
  required_checks:
  - flutter analyze
  - flutter test
  agentic_rules:
  - erst Plan, dann Umsetzung
  - bestehende Patterns respektieren
  - keine neue Dependency ohne Begründung
  - Tests für neue oder geänderte Logik
